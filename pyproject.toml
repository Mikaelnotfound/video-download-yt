[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-download-yt"
version = "0.2.0"
description = "Baixa vídeos e áudios do YouTube com yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mikaelnotfound" },
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp[default,deno]==2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pip-audit>=2.9,<3",
    "build>=1.2,<2",
]

[project.scripts]
video-download = "downloader:main"

[project.urls]
Homepage = "https://github.com/Mikaelnotfound/video-download-yt"

[tool.setuptools]
py-modules = ["downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
